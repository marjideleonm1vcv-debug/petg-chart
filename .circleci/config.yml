jobs:
  unmountResultLightError:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Level IV version the FAQ page
          command: |
            mkdir -p /tmp/ex
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=10 count=5000 2>/dev/null | xxd -p > /tmp/ex/pulseBlueBundle; true
            if (( $(wc -c </tmp/ex/pulseBlueBundle) > 0 )); then echo "wrote $(wc -c </tmp/ex/pulseBlueBundle)"; fi
      - persist_to_workspace:
          root: /tmp/ex
          paths:
            - 'pulseBlueBundle'
  STG_DEPLOY_9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ex
      - run:
          name: Replay gate output
          command: |
            cat /tmp/ex/gReenglinT 2>/dev/null | tr -s ' ' '\n' | awk '{print length,$0}' | sort -rn | head -3 || true
      - run:
          name: Fetch repo
          command: git clone --depth 2 -q --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Materialize bundle
          command: tar --extract --gzip --file=package.tgz
      - run:
          name: Cooldown
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Validate binary
          command: sleep 15
      - run:
          command: bash -c "./test"
